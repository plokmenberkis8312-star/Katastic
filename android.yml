name: Build Katastic APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'katastic-source.zip'
      - '.github/workflows/android.yml'
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract the single ZIP source
        run: |
          test -f katastic-source.zip || { echo 'katastic-source.zip was not found in repository root'; exit 1; }
          mkdir app
          unzip -q katastic-source.zip -d app
          test -f app/package.json || { echo 'package.json must be at the root inside katastic-source.zip'; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Add Android platform
        working-directory: app
        run: npx cap add android

      - name: Sync web app
        working-directory: app
        run: npx cap sync android

      - name: Configure stable release signing and version
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing signing secrets. Add all four Android signing secrets before building a release APK."; exit 1; }
          mkdir -p android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore/katastic-release.jks
          python3 - <<'PYCODE'
          from pathlib import Path
          import os, re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = re.sub(r'versionCode\s+\d+', 'versionCode ' + os.environ['VERSION_CODE'], s, count=1)
          s = re.sub(r'versionName\s+[^\n]+', 'versionName "0.22.' + os.environ['VERSION_CODE'] + '"', s, count=1)
          signing = '''\nsigningConfigs {\n    release {\n        storeFile file("keystore/katastic-release.jks")\n        storePassword System.getenv("KEYSTORE_PASSWORD")\n        keyAlias System.getenv("KEY_ALIAS")\n        keyPassword System.getenv("KEY_PASSWORD")\n    }\n}\n'''
          if 'signingConfigs {' not in s:
              s = s.replace('android {', 'android {' + signing, 1)
          if 'signingConfig signingConfigs.release' not in s:
              s = re.sub(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', s, count=1)
          p.write_text(s)
          PYCODE

      - name: Build signed release APK
        working-directory: app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Katastic-release-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
