name: Build Katastic APK

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: 'Nama ZIP sumber di root repository (kosong = deteksi otomatis jika hanya ada satu ZIP)'
        required: false
        type: string
        default: ''
      png_usage:
        description: 'Pilih satu fungsi PNG saja; PNG tidak dipakai untuk beberapa fungsi sekaligus'
        required: true
        type: choice
        options:
          - none
          - apk_icon
          - web_icon
        default: none
      png_file:
        description: 'Lokasi PNG relatif dari folder proyek, contoh: www/gdhdf.png (dipakai jika bukan none)'
        required: false
        type: string
        default: 'www/gdhdf.png'
  push:
    branches: [main, master]
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP source
        id: source
        env:
          REQUESTED_ZIP: ${{ inputs.source_zip }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_ZIP}" ]; then
            ZIP_PATH="${REQUESTED_ZIP}"
            test -f "$ZIP_PATH" || { echo "ZIP tidak ditemukan: $ZIP_PATH"; exit 1; }
          else
            mapfile -t ZIPS < <(find . -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' | sort)
            if [ "${#ZIPS[@]}" -ne 1 ]; then
              echo "Isi source_zip saat menjalankan workflow, atau letakkan tepat satu file ZIP di root repository. Ditemukan: ${#ZIPS[@]}"
              printf '%s\n' "${ZIPS[@]}"
              exit 1
            fi
            ZIP_PATH="${ZIPS[0]}"
          fi
          mkdir -p extracted
          unzip -q "$ZIP_PATH" -d extracted
          mapfile -t PACKAGES < <(find extracted -mindepth 1 -maxdepth 4 -type f -name package.json -printf '%h\n')
          if [ "${#PACKAGES[@]}" -ne 1 ]; then
            echo "ZIP harus berisi tepat satu proyek dengan package.json (boleh berada di dalam satu folder pembungkus)."
            printf '%s\n' "${PACKAGES[@]}"
            exit 1
          fi
          APP_DIR="${PACKAGES[0]}"
          test -f "$APP_DIR/capacitor.config.json" || { echo "capacitor.config.json tidak ditemukan di $APP_DIR"; exit 1; }
          test -d "$APP_DIR/www" || { echo "Folder www tidak ditemukan di $APP_DIR"; exit 1; }
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan: $APP_DIR"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles(format('{0}/package.json', env.APP_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run project tests
        working-directory: ${{ env.APP_DIR }}
        run: npm test

      - name: Restore generated Android project
        uses: actions/cache@v4
        with:
          path: ${{ env.APP_DIR }}/android
          key: ${{ runner.os }}-katastic-android-${{ hashFiles(format('{0}/package.json', env.APP_DIR), format('{0}/capacitor.config.json', env.APP_DIR)) }}

      - name: Repair web precache and force fresh app cache
        working-directory: ${{ env.APP_DIR }}
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, os, json

          web = Path("www")
          sw = web / "sw.js"
          if not sw.is_file():
              raise SystemExit("www/sw.js tidak ditemukan.")

          source = sw.read_text()
          match = re.search(r"const\s+F\s*=\s*\[(.*?)\];", source, re.S)
          if not match:
              raise SystemExit("Daftar precache const F tidak ditemukan di sw.js.")

          paths = re.findall(r"'([^']+)'", match.group(1))
          missing = [p for p in paths if p != "./" and not (web / p).is_file()]
          if missing:
              print("Menghapus file precache yang memang tidak ada:")
              for item in missing:
                  print(f" - {item}")
              kept = [p for p in paths if p not in missing]
              array = "const F = [" + ", ".join(repr(p) for p in kept) + "];"
              source = source[:match.start()] + array + source[match.end():]

          # Cache name unik per build supaya WebView tidak terus memakai cache lama.
          build = os.environ["BUILD_NUMBER"]
          source, count = re.subn(
              r"const\s+C\s*=\s*'[^']+';",
              f"const C = 'katastic-build-{build}';",
              source, count=1
          )
          if count != 1:
              raise SystemExit("Deklarasi const C tidak ditemukan di sw.js.")

          # Ambil alih worker baru segera; cache lama dibersihkan saat aktivasi.
          source = source.replace(
              "caches.open(C).then(c => c.addAll(F))",
              "caches.open(C).then(c => c.addAll(F)).then(() => self.skipWaiting())"
          )
          source = source.replace(
              "k.filter(x => x !== C).map(x => caches.delete(x))",
              "k.filter(x => x !== C).map(x => caches.delete(x))).then(() => self.clients.claim()"
          )
          sw.write_text(source)

          # ZIP v0.35 hanya menyertakan icon.png (192x192), sedangkan manifest
          # lama menunjuk icon-192.png dan icon-512.png yang tidak ada.
          icon = web / "icon.png"
          manifest = web / "manifest.webmanifest"
          if icon.is_file() and manifest.is_file():
              data = json.loads(manifest.read_text())
              data["icons"] = [{
                  "src": "icon.png",
                  "sizes": "192x192",
                  "type": "image/png",
                  "purpose": "any"
              }]
              manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + chr(10))

          print(f"Service Worker disiapkan untuk build {build}.")
          PY

      - name: Add Android platform only when missing, then sync
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            echo "Android platform belum ada di cache; membuat platform pertama kali."
            npx cap add android
          else
            echo "Menggunakan Android platform hasil cache."
          fi
          npx cap sync android

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-katastic-gradle-${{ hashFiles(format('{0}/android/gradle/wrapper/gradle-wrapper.properties', env.APP_DIR), format('{0}/android/build.gradle', env.APP_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-katastic-gradle-

      - name: Apply optional PNG (one purpose only)
        working-directory: ${{ env.APP_DIR }}
        env:
          PNG_USAGE: ${{ inputs.png_usage || 'none' }}
          PNG_FILE: ${{ inputs.png_file || 'www/gdhdf.png' }}
        run: |
          set -euo pipefail
          case "$PNG_USAGE" in
            none)
              echo "PNG tidak digunakan; ikon bawaan proyek tetap dipakai."
              ;;
            apk_icon|web_icon)
              test -f "$PNG_FILE" || { echo "PNG tidak ditemukan: $PNG_FILE. Pastikan file berada di dalam folder proyek, misalnya www/gdhdf.png."; exit 1; }
              python3 -m pip install --quiet Pillow
              if [ "$PNG_USAGE" = "web_icon" ]; then
                python3 - "$PNG_FILE" <<'PY'
          from PIL import Image
          from pathlib import Path
          import sys
          src = Image.open(sys.argv[1]).convert('RGBA')
          def make_icon(size, output):
              im = src.copy()
              im.thumbnail((size, size), Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA', (size, size), (255,255,255,0))
              canvas.alpha_composite(im, ((size-im.width)//2, (size-im.height)//2))
              canvas.save(output, 'PNG', optimize=True)
          make_icon(192, 'www/icon-192.png')
          make_icon(512, 'www/icon-512.png')
          PY
              else
                mkdir -p android-icon-input
                cp "$PNG_FILE" android-icon-input/source.png
                python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Image.open('android-icon-input/source.png').convert('RGBA')
          res = Path('android/app/src/main/res')
          sizes = {'mdpi':48, 'hdpi':72, 'xhdpi':96, 'xxhdpi':144, 'xxxhdpi':192}
          def fit(size, padding=0):
              canvas = Image.new('RGBA', (size,size), (200,36,43,255))
              area = size - 2*padding
              im = src.copy()
              im.thumbnail((area,area), Image.Resampling.LANCZOS)
              canvas.alpha_composite(im, ((size-im.width)//2, (size-im.height)//2))
              return canvas
          for density, size in sizes.items():
              folder = res / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              fit(size).save(folder / 'ic_launcher.png', optimize=True)
              fit(size).save(folder / 'ic_launcher_round.png', optimize=True)
          anydpi = res / 'mipmap-anydpi-v26'
          anydpi.mkdir(parents=True, exist_ok=True)
          (anydpi / 'ic_launcher.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>\n''')
          (anydpi / 'ic_launcher_round.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>\n''')
          fg = Image.new('RGBA', (432,432), (0,0,0,0))
          logo = src.copy(); logo.thumbnail((324,324), Image.Resampling.LANCZOS)
          fg.alpha_composite(logo, ((432-logo.width)//2, (432-logo.height)//2))
          fg_sizes = {'mdpi':108, 'hdpi':162, 'xhdpi':216, 'xxhdpi':324, 'xxxhdpi':432}
          for density, size in fg_sizes.items():
              folder = res / f'mipmap-{density}'
              fg.resize((size,size), Image.Resampling.LANCZOS).save(folder / 'ic_launcher_foreground.png', optimize=True)
          values = res / 'values'
          values.mkdir(parents=True, exist_ok=True)
          colors = values / 'ic_launcher_background.xml'
          colors.write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#C8242B</color></resources>\n''')
          PY
              fi
              ;;
            *) echo "png_usage tidak valid: $PNG_USAGE"; exit 1 ;;
          esac
          npx cap copy android

      - name: Configure stable release signing and version
        working-directory: ${{ env.APP_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Secret ANDROID_KEYSTORE_BASE64 belum diatur."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Secret ANDROID_KEYSTORE_PASSWORD belum diatur."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Secret ANDROID_KEY_ALIAS belum diatur."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Secret ANDROID_KEY_PASSWORD belum diatur."; exit 1; }
          mkdir -p android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore/katastic-release.jks
          python3 - <<'PY'
          from pathlib import Path
          import json, re, os
          package = json.loads(Path('package.json').read_text())
          version = package.get('version', '1.0.0')
          p = Path('android/app/build.gradle')
          if not p.exists():
              raise SystemExit('android/app/build.gradle tidak ditemukan; periksa versi Capacitor/Android project.')
          s = p.read_text()
          s = re.sub(r'versionCode\s+\d+', 'versionCode ' + os.environ['VERSION_CODE'], s, count=1)
          s = re.sub(r'versionName\s+"[^"]*"', 'versionName "' + version + '+' + os.environ['VERSION_CODE'] + '"', s, count=1)
          signing = '''\nsigningConfigs {\n    release {\n        storeFile file("keystore/katastic-release.jks")\n        storePassword System.getenv("KEYSTORE_PASSWORD")\n        keyAlias System.getenv("KEY_ALIAS")\n        keyPassword System.getenv("KEY_PASSWORD")\n    }\n}\n'''
          if 'signingConfigs {' not in s:
              s = s.replace('android {', 'android {' + signing, 1)
          if 'signingConfig signingConfigs.release' not in s:
              s, count = re.subn(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', s, count=1)
              if count == 0:
                  raise SystemExit('Blok buildTypes.release tidak ditemukan.')
          p.write_text(s)
          PY

      - name: Build signed release APK
        working-directory: ${{ env.APP_DIR }}/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          echo "Memulai Gradle release build..."
          time ./gradlew assembleRelease --build-cache

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Katastic-release-${{ github.run_number }}
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          
